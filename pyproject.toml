[project]
name = "deal-hunter"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "samuelmel", email = "samuca21santos@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "playwright>=1.62.0",
    "python-dotenv>=1.2.3",
    "python-telegram-bot>=22.8",
]

[project.scripts]
deal-hunter = "app.cli:main"

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
